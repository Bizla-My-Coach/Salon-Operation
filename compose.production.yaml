# Standalone production file: do NOT merge with compose.yaml.
services:
  web:
    image: ${SALONOPS_IMAGE:?Set SALONOPS_IMAGE to an approved application image}
    restart: unless-stopped
    environment:
      # Explicit allowlist: never pass bootstrap-admin or backup secrets to web.
      APP_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set a unique random SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set explicit hostnames}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-False}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-300}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set the restricted app user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the app database password}
      REVIEW_INTEGRATION_KEY_SANDBOX: ${REVIEW_INTEGRATION_KEY_SANDBOX:-}
      REVIEW_INTEGRATION_KEY_PRODUCTION: ${REVIEW_INTEGRATION_KEY_PRODUCTION:-}
      AUTO_MIGRATE: "false"
      CHECK_DEPLOY: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: salonops_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set the bootstrap password}
      APP_DB_USER: ${POSTGRES_USER:?Set the restricted app user}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set the app database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-app-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salonops_admin -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:?Set a permanent, environment-specific volume name}

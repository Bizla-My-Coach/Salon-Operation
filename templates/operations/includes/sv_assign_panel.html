<section class="sv-person-panel" data-panel="{{ p.key }}" aria-label="Staff for {{ p.name }}"{% if not forloop.first and not active %} hidden{% endif %}>
  {% if p.new %}<input type="hidden" name="new_person" value="{{ p.key }}">{% endif %}
  {% if not p.main %}
  <div class="sv-person-name">
    <label for="name_{{ p.key }}">Name <small>optional</small></label>
    <input id="name_{{ p.key }}" class="form-control" name="name_{{ p.key }}" value="{{ p.typed_name }}" placeholder="{% if p.new %}Guest{% else %}{{ p.name }}{% endif %}" maxlength="120" autocomplete="off" data-person-name>
    {% if p.can_remove %}<button type="button" class="button outline sv-remove" data-remove-person>Remove</button>{% endif %}
  </div>
  {% endif %}
  <div class="sv-pick-grid" role="group" aria-label="Staff on duty">
    {% for row in p.rows %}
    <div class="sv-tile" data-staff-tile data-name="{{ row.name|lower }}">
      <label class="sv-tile-name">
        <input type="checkbox" name="staff_{{ p.key }}_{{ row.pk }}" value="1" data-staff="{{ row.pk }}"{% if row.checked %} checked{% endif %}>
        <span class="sv-avatar" aria-hidden="true">{{ row.initial }}</span>
        <span class="sv-pick-text"><b>{{ row.name }}</b><small>{% if row.saved %}Saved: {{ row.saved }}{% elif row.busy %}{{ row.busy }} waiting{% else %}Free{% endif %}</small></span>
      </label>
      <div class="sv-tile-cats" role="group" aria-label="Categories for {{ row.name }}">
        {% for c in row.cats %}<label title="{{ c.label }}"><input type="checkbox" name="category_{{ p.key }}_{{ row.pk }}" value="{{ c.key }}"{% if c.checked %} checked{% endif %}{% if c.locked %} disabled{% endif %}><span>{{ c.label }}</span></label>{% endfor %}
      </div>
    </div>
    {% empty %}<div class="empty-state"><b>No staff on duty</b><span>Set today's roster first.</span></div>
    {% endfor %}
  </div>
</section>

{% extends 'base.html' %}
{% block title %}Change password · Hairship{% endblock %}
{% block content %}
<div class="password-page">
  <header class="page-head">
    <span class="eyebrow">My account</span>
    <h1>Change password</h1>
    <p>Choose a new password for {{ user.username }}. You will stay signed in on this device.</p>
  </header>
  <section class="panel">
    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ password_form.as_p }}
      <div class="password-actions">
        <button class="button primary" type="submit">Change password</button>
        <a class="button outline" href="{% url 'my_profile' %}">Back to profile</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}

<form method="get" class="review-filters">
{% if demo %}<input type="hidden" name="demo" value="1">{% endif %}
{% if senior %}<div><label for="branch">Branch</label><select id="branch" name="branch"><option value="">All branches</option>{% for branch in branches %}<option value="{{ branch.pk }}" {% if selected_branch == branch.pk|stringformat:'s' %}selected{% endif %}>{{ branch.name }}</option>{% endfor %}</select></div>{% endif %}
{% if review_admin %}<div><label for="sentiment">Sentiment</label><select id="sentiment" name="sentiment"><option value="">All sentiments</option>{% for item in sentiments %}<option value="{{ item }}" {% if selected_sentiment == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div>{% endif %}
<div><label for="priority">Priority</label><select id="priority" name="priority"><option value="">All priorities</option>{% for item in priorities %}<option value="{{ item }}" {% if selected_priority == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div>
{% if statuses %}<div><label for="status">Handling</label><select id="status" name="status">{% for key,label in statuses %}<option value="{{ key }}" {% if selected_status == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
<button class="button outline">Apply filters</button></form>

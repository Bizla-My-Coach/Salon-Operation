{% if senior and filter_form %}
<form method="get" class="review-filters">
  {% if demo %}<input type="hidden" name="demo" value="1">{% endif %}
  <input type="hidden" name="status" value="{{ selected_status }}">
  {{ filter_form.non_field_errors }}
  {% for field in filter_form %}<div>{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
  <button class="button outline" type="submit">Apply filters</button>
  <a href="{% url 'google_review_inbox' %}{% if demo %}?demo=1{% endif %}">Clear filters</a>
</form>
{% endif %}

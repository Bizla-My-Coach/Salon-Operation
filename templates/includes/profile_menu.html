<details class="account-menu">
  <summary class="profile-icon" aria-label="Open profile menu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
  </summary>
  <div class="account-dropdown">
    <div class="account-identity"><strong>{{ user.get_full_name|default:user.username }}</strong><small>{{ user.profile.get_role_display }}</small></div>
    <a class="button primary account-profile-link" href="{% url 'my_profile' %}">Profile</a>
    <a class="button outline" href="{% url 'change_password' %}">Change password</a>
    <label class="theme-control"><span>Dark mode</span><input type="checkbox" role="switch" aria-label="Dark mode" data-theme-toggle><span class="theme-track" aria-hidden="true"></span></label>
    <small data-theme-save-status role="status" aria-live="polite"></small>
    <button type="button" class="button outline" data-install-app hidden>Install Hairship</button>
    <small data-install-status role="status" aria-live="polite"></small>
    <a class="account-signout" href="{% url 'logout' %}">Sign out</a>
  </div>
</details>

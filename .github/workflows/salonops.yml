name: SalonOps checks and deployment
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: salonops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      registry_path: ${{ steps.publish.outputs.registry_path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Create ephemeral CI credentials (never uploaded)
        shell: bash
        run: |
          umask 077
          {
            echo APP_ENV=development
            echo DEBUG=True
            echo "SECRET_KEY=$(openssl rand -hex 64)"
            echo ALLOWED_HOSTS=localhost,127.0.0.1,testserver
            echo POSTGRES_HOST=db
            echo POSTGRES_PORT=5432
            echo POSTGRES_DB=salonops_ci
            echo POSTGRES_USER=salonops_ci
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
          } > .env
      - name: Build and test on PostgreSQL
        run: |
          docker compose up --build -d --wait --wait-timeout 120
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py makemigrations --check --dry-run
          docker compose exec -T web python manage.py test
          node --test tests/*.test.cjs
          docker compose exec -T -e APP_ENV=production -e DEBUG=False -e TRUST_PROXY_HEADERS=True web python manage.py check_production_security
          bash tests/ops_scripts.test.sh
          # Free CI's port 8000 before the standalone preview smoke test.
          docker compose stop web
          bash tests/preview_smoke.test.sh
      - name: Publish only a tested branch-push image
        id: publish
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          tag="ghcr.io/$repository:$GITHUB_SHA"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag salon-operation:local "$tag"
          docker push "$tag"
          image=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry_path=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
      - name: Remove ephemeral CI containers and data
        if: always()
        run: docker compose down -v
        # Safe ONLY on the disposable GitHub-hosted CI VM. Never run this on a VPS.
  deploy-production:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, salonops-production]
    environment: production
    timeout-minutes: 30
    concurrency:
      group: salonops-production-deployment
      cancel-in-progress: false
    env:
      SALONOPS_USE_CADDY: ${{ vars.SALONOPS_USE_CADDY || 'false' }}
      SALONOPS_IMAGE: ${{ needs.checks.outputs.image }}
      REGISTRY_PATH: ${{ needs.checks.outputs.registry_path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install reviewed operational files and deploy production
        shell: bash
        run: |
          root=/opt/salonops-prod
          mkdir -p "$root/deploy" "$root/scripts"
          cp compose.production.yaml compose.caddy.yaml "$root/"
          cp -r deploy/postgres "$root/deploy/"
          chmod 644 "$root/deploy/postgres/10-create-app-user.sh"
          cp deploy/Caddyfile "$root/deploy/"
          chmod 644 "$root/deploy/Caddyfile"
          cp scripts/*.sh "$root/scripts/"
          bash "$root/scripts/deploy.sh" /etc/salonops/prod.env salonops-prod "$root/compose.production.yaml" /var/lib/salonops-prod/backups /etc/salonops/prod.restic.env "$SALONOPS_IMAGE" "$REGISTRY_PATH"

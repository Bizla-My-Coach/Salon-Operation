name: Codespaces dev smoke test
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codespaces-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: salonops-codespaces-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the isolated Codespaces stack
        run: |
          bash .devcontainer/initialize.sh
          docker compose -f .devcontainer/compose.yaml up --build -d --wait --wait-timeout 120
      - name: Start with the same command used in Codespaces
        run: docker compose -f .devcontainer/compose.yaml exec -d workspace bash -c 'bash scripts/codespace.sh > /tmp/salonops-codespaces-startup.log 2>&1'
      - name: Verify HTTP login and repeat-safe demo setup
        run: |
          docker compose -f .devcontainer/compose.yaml exec -T workspace python tests/codespaces_smoke.py
          docker compose -f .devcontainer/compose.yaml exec -T workspace python manage.py seed_codespaces
          docker compose -f .devcontainer/compose.yaml exec -T workspace python manage.py test operations.test_codespaces --noinput
      - name: Startup logs
        if: failure()
        run: |
          docker compose -f .devcontainer/compose.yaml logs --tail=100
          docker compose -f .devcontainer/compose.yaml exec -T workspace cat /tmp/salonops-codespaces-startup.log || true
      - name: Remove disposable CI data
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down -v
